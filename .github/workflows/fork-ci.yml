name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm fork:setup
      - name: Check changed files, web types and themes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=HEAD^
          fi
          # An upstream merge checks the preserved fork delta against that release.
          merge="$(git rev-list --first-parent --merges "$base..HEAD" | head -n 1)"
          if [ -n "$merge" ]; then
            base="$(git rev-parse "$merge^2")"
          fi
          pnpm fork:check "$base"
