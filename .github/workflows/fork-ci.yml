name: Fork CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm fork:setup
      - name: Check changed files, web types and themes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=HEAD^
          fi
          # A newly integrated upstream release checks only the preserved fork delta.
          release="$(git tag --merged HEAD --no-merged "$base" --list 'v*' --sort=-version:refname | sed -n '1p')"
          if [ -n "$release" ]; then
            base="$(git rev-parse "$release^{commit}")"
          fi
          pnpm fork:check "$base"
